<html lang="en">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CTI Fundamentals — Secure Instructor Evaluator</title>
<style>
  :root{ --bg:#0b1220; --panel:#121c2e; --ink:#e8eef7; --muted:#9fb0c7; --accent:#4da3ff; --accent2:#2bd4a7; --line:#26344d; --bad:#ff6b6b; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0b1220,#0d1626);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
  .lock{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:30px 26px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center}
  .lock h1{font-size:18px;margin:0 0 4px}
  .lock p{color:var(--muted);font-size:13px;margin:0 0 20px}
  .lock .icon{font-size:34px;margin-bottom:8px}
  input[type=password]{width:100%;background:#0e1829;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:12px}
  input[type=password]:focus{outline:none;border-color:var(--accent)}
  button{width:100%;appearance:none;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#06131f}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:16px}
  .note{color:var(--muted);font-size:11px;margin-top:16px;line-height:1.5}
</style>
</head>

    </form>

const b64ToBytes = (b64)=> Uint8Array.from(atob(b64), c=>c.charCodeAt(0));

async function deriveKey(password, saltBytes, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:saltBytes, iterations, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );
}

async function unlock(password){
  const salt = b64ToBytes(PAYLOAD.kdf.salt_b64);
  const iv   = b64ToBytes(PAYLOAD.cipher.iv_b64);
  const data = b64ToBytes(PAYLOAD.data_b64);
  const key  = await deriveKey(password, salt, PAYLOAD.kdf.iterations);
  // Throws if the auth tag fails (wrong password) — nothing is revealed.
  const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plainBuf);
}

function renderDecrypted(html){
  // Replace the entire document with the decrypted evaluator and run its scripts.
  document.open();
  document.write(html);
  document.close();
}

const form = document.getElementById('unlockForm');
const err = document.getElementById('err');
const btn = document.getElementById('btn');
const pw = document.getElementById('pw');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  err.textContent='';
  btn.disabled=true; btn.textContent='Decrypting…';
  try{
    const html = await unlock(pw.value);
    // Sanity check that we got real HTML (defense against pathological edge cases).
    if(!/^\s*<!DOCTYPE html/i.test(html) && !/<html/i.test(html)) throw new Error('bad');
    renderDecrypted(html);
  }catch(_){
    btn.disabled=false; btn.textContent='Unlock';
    err.textContent='Incorrect password.';
    pw.value=''; pw.focus();
  }
});
</script>
